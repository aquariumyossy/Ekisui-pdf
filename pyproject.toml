[project]
name = "ekisui-pdf"
version = "0.1.0"
description = "日本語の法律文書PDFをローカルだけで墨消しするツール"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "ekisui-pdf contributors"}]
dependencies = [
  "PyMuPDF>=1.24",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10",
  "onnxruntime>=1.17",
  "PySide6>=6.6",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ekisui-pdf = "ekisui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ekisui = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
  "ignore:.*fitz.*:DeprecationWarning",
  "ignore::FutureWarning",
]
