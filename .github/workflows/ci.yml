name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries and a Japanese font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1 fonts-wqy-microhei
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Model hashes
        run: python tools/verify_models.py
      - name: Tests
        run: python -m pytest -q

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pyinstaller
      - name: Model hashes
        run: python tools/verify_models.py
      - name: Bundle
        run: pyinstaller ekisui.spec
      - name: Frozen smoke
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          New-Item -ItemType Directory -Force -Path dist\smoke-out | Out-Null
          & dist\ekisui-pdf\ekisui-pdf.exe --smoke dist\smoke-out
          if ($LASTEXITCODE -ne 0) {
            Write-Host "SMOKE_EXIT $LASTEXITCODE"
            if (Test-Path dist\smoke-out\smoke.log) { Get-Content dist\smoke-out\smoke.log }
            exit 1
          }
          Get-Content dist\smoke-out\smoke.log
          python tools/check_bundle.py dist\ekisui-pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inno Setup
        run: choco install innosetup -y
      - name: Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ekisui-pdf.iss
      - name: SHA-256
        run: |
          Get-FileHash dist\ekisui-pdf-0.1.0-win64-setup.exe -Algorithm SHA256 | Format-List
          $setup = (Get-Item dist\ekisui-pdf-0.1.0-win64-setup.exe).Length
          Write-Host "SETUP_BYTES $setup"
      - uses: actions/upload-artifact@v4
        with:
          name: ekisui-pdf-0.1.0-win64-setup
          path: dist/ekisui-pdf-0.1.0-win64-setup.exe
          if-no-files-found: error
