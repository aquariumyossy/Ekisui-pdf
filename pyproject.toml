[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekisui-pdf"
version = "0.1.0"
description = "手元だけで動く、スキャンPDFの透明テキスト化と墨消し"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "pymupdf>=1.24.10,<2",
    "PySide6>=6.7,<6.11",
    "rapidocr==3.10.0",
    "onnxruntime>=1.17,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ekisui-pdf = "ekisui_pdf.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ekisui_pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
